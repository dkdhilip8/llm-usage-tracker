# Render blueprint: this web service + a Neon Postgres project.
# Paste the Neon connection string into DATABASE_URL after the first deploy.
services:
  - type: web
    name: llm-usage-tracker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Marks this as a deployed environment: the app refuses to start on the
      # built-in dev SECRET_KEY (generated below).
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      # Signs the session cookie + peppers virtual-key hashes.
      - key: SECRET_KEY
        generateValue: true
      # Encrypts each workspace's stored provider keys (Fernet). Set explicitly so
      # rotating SECRET_KEY does not orphan them.
      - key: ENCRYPTION_KEY
        generateValue: true
      # Live upstream calls are enabled — but only for a virtual key whose
      # workspace has attached its own provider API key, and only up to that
      # provider's monthly cap. No server-side provider key is set below, so
      # nothing is billed until a workspace attaches one.
      - key: ENABLE_LIVE
        value: "true"
      # Don't store prompt/response bodies by default.
      - key: LOG_BODIES
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

