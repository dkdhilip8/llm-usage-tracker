# Render blueprint. Recommended: this web service + a free Neon Postgres project.
# Paste the Neon pooled connection string into DATABASE_URL after the first deploy.
services:
  - type: web
    name: llm-usage-tracker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Marks this as a deployed environment: the app refuses to start on the
      # built-in dev ADMIN_TOKEN / SECRET_KEY (both generated below).
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      # Keep the public demo simulated + free. To enable real calls later: set
      # ENABLE_LIVE=true, add the provider key(s) below, and give a key `allow_live`.
      - key: ENABLE_LIVE
        value: "false"
      # Populate the shared demo dataset on first boot (no-op once usage exists).
      - key: SEED_DEMO_DATA
        value: "true"
      # Never store prompt/response bodies on the public deploy.
      - key: LOG_BODIES
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

# ---- all-Render fallback (Render free Postgres is deleted 30 days after creation) ----
# databases:
