# Render blueprint. Recommended: this web service + a free Neon Postgres project.
# Paste the Neon pooled connection string into DATABASE_URL after the first deploy.
services:
  - type: web
    name: llm-usage-tracker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Marks this as a deployed environment: the app refuses to start on the
      # built-in dev ADMIN_TOKEN / SECRET_KEY (both generated below).
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      # Admin login front door. Required in a deployed ENVIRONMENT.
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      # Live upstream calls ARE enabled — but only for a virtual key whose owner
      # has attached their OWN provider API key on the Account page, and only up
      # to that account's monthly cap (<= $LIVE_CAP_MAX_USD). No server-side
      # provider key is set here, so nothing is ever billed to the host.
      - key: ENABLE_LIVE
        value: "true"
      # Populate the shared demo dataset on first boot (no-op once usage exists).
      - key: SEED_DEMO_DATA
        value: "true"
      # Never store prompt/response bodies on the public deploy.
      - key: LOG_BODIES
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

