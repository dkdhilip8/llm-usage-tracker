# Tooling config only — runtime deps live in requirements.txt, dev deps in requirements-dev.txt.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]  # B008: FastAPI Depends() in defaults is intentional

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
