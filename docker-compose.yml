services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: llm
      POSTGRES_PASSWORD: llm
      POSTGRES_DB: llmtracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://llm:llm@db:5432/llmtracker
      ADMIN_TOKEN: dev-admin-token
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: dev-password
      SECRET_KEY: dev-secret
      CORS_ORIGINS: http://localhost:5173
      # Local-only: let the Admin UI store provider keys (encrypted) in the DB.
      ALLOW_DB_PROVIDER_KEYS: "true"
      # Provider creds + live switch come from the gitignored ./.env (never committed).
      # Absent .env => all blank, ENABLE_LIVE=false => fully simulated.
      ENABLE_LIVE: ${ENABLE_LIVE:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # Optional dev tool — NOT part of the product.
  # Start with: docker compose --profile tools up
  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    depends_on:
      - db
    profiles:
      - tools

volumes:
  pgdata:
